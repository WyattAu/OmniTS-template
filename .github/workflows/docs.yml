# Docs gate: shared workflow from WyattAu/spec-standards (SPEC-CORE SS8/SS9).
# Inherited by every repo created from this template (ADR 0011, engineering-standards).
name: docs
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    uses: WyattAu/spec-standards/.github/workflows/docs.yml@main
    with:
      tier: k
