# Changesets flow: the changesets bot PRs version bumps; merging version
# packages + publishes with npm provenance. Requires secret NPM_TOKEN.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changesets:
    runs-on: ubuntu-latest
    # Armed via repo *variable* RELEASE_ENABLED=true (+ NPM_TOKEN secret)
    # so fresh templates stay green (skipped) instead of red.
    if: ${{ github.repository_owner == 'WyattAu' && vars.RELEASE_ENABLED == 'true' }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: create version PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: bunx changeset version
          publish: bun publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

