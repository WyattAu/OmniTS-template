# Changesets flow: the changesets bot PRs version bumps; merging version
# packages + publishes with npm provenance. Requires secret NPM_TOKEN.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changesets:
    runs-on: ubuntu-latest
    # Armed via repo *variable* RELEASE_ENABLED=true (+ NPM_TOKEN secret)
    # so fresh templates stay green (skipped) instead of red.
    if: ${{ github.repository_owner == 'WyattAu' && vars.RELEASE_ENABLED == 'true' }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: create version PR
        uses: changesets/action@v1
        with:
          version: bunx changeset version
          publish: bun publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
